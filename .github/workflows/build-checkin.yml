name: build-checkin-apk

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-checkin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Capacitor
        run: |
          npm init -y
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: 初始化安卓工程
        run: |
          mkdir -p www
          echo '<!doctype html><meta charset=utf-8><title>查寝打卡</title>' > www/index.html
          npx cap init "查寝打卡" "com.zzu.checkin" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: 提高 minSdk 到 24
        run: |
          sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle
          grep minSdkVersion android/variables.gradle

      - name: 写入源码
        run: |
          D=android/app/src/main/java/com/zzu/checkin
          X=android/app/src/main/res/xml
          V=android/app/src/main/res/values
          mkdir -p "$D" "$X" "$V"
          printf '%s' '' | base64 -d > "$D/App.java"
          printf '%s' '' | base64 -d > "$D/MainActivity.java"
          printf '%s' '' | base64 -d > "$D/CheckinService.java"
          printf '%s' '' | base64 -d > "$D/CheckinStatus.java"
          printf '%s' '' | base64 -d > "$D/CheckinAlarm.java"
          printf '%s' '' | base64 -d > "$D/BootReceiver.java"
          printf '%s' '' | base64 -d > "$D/Notify.java"
          printf '%s' '' | base64 -d > "$X/accessibility_service_config.xml"
          printf '%s' '' | base64 -d > "$V/strings_checkin.xml"
          printf '%s' '' | base64 -d > android/app/src/main/AndroidManifest.xml
          ls -l "$D"
          head -3 "$D/MainActivity.java"
          grep -c service android/app/src/main/AndroidManifest.xml

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 检查产物
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: checkin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
