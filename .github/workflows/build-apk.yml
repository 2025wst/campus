name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 组装网页目录
        run: |
          mkdir -p www
          cp index.html www/
          for f in manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          ls -lh www/

      - name: 安装 Capacitor
        run: |
          npm init -y
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: 初始化安卓工程
        run: |
          npx cap init "校园通" "com.zzu.campus" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 检查产物
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
