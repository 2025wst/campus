name: build-apk

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build-apk.yml'
      - '*.java'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 组装网页目录
        run: |
          mkdir -p www
          cp index.html www/
          for f in manifest.webmanifest sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          ls -lh www/

      - name: 安装 Capacitor
        run: |
          npm init -y
          npm i --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: 初始化安卓工程
        run: |
          npx cap init "校园通" "com.zzu.campus" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: 注入原生抓取代码
        run: |
          D=android/app/src/main/java/com/zzu/campus
          mkdir -p "$D"
          RAW=https://raw.githubusercontent.com/2025wst/campus/main
          PAGE=https://2025wst.github.io/campus
          curl -fsSL -o "$D/TimetablePlugin.java" "$RAW/TimetablePlugin.java" || curl -fsSL -o "$D/TimetablePlugin.java" "$PAGE/TimetablePlugin.java"
          curl -fsSL -o "$D/MainActivity.java" "$RAW/MainActivity.java" || curl -fsSL -o "$D/MainActivity.java" "$PAGE/MainActivity.java"
          curl -fsSL -o "$D/ExpenseListener.java" "$RAW/ExpenseListener.java" || curl -fsSL -o "$D/ExpenseListener.java" "$PAGE/ExpenseListener.java"
          wc -l "$D"/*.java
          head -3 "$D/TimetablePlugin.java"
          sed -i '0,/<activity/s//<service android:name=".ExpenseListener" android:exported="false" android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"><intent-filter><action android:name="android.service.notification.NotificationListenerService" \/><\/intent-filter><\/service>\n        <activity/' android/app/src/main/AndroidManifest.xml
          sed -i '0,/<activity/s//<activity android:name=".TimetablePlugin$ImportActivity" android:exported="false" \/>\n        <activity/' android/app/src/main/AndroidManifest.xml
          grep -n 'ImportActivity\|ExpenseListener' android/app/src/main/AndroidManifest.xml

      - name: 换成我们的图标
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icon-512.png android/app/src/main/res/drawable/ic_launcher.png
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' android/app/src/main/AndroidManifest.xml
          sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@drawable/ic_launcher"|' android/app/src/main/AndroidManifest.xml
          grep -n 'android:icon' android/app/src/main/AndroidManifest.xml

      - name: 编译 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 检查产物
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
