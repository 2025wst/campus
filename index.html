<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>校园通</title>
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="description" content="课表、记账、待办——你的校园生活助手" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<link rel="icon" href="./icon-192.png" />
<style>
/* 校园通 · 设计系统
 * 原则：纯白底 + 一个主色（郑大蓝）+ 大量留白；字号只用 11/13/15/17/22 五档。
 */

:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --line: #eceef2;
  --line-strong: #e0e3e9;
  --text: #16181d;
  --text-2: #6b7280;
  --text-3: #9aa1ac;
  --brand: #1a4fa0;
  --brand-ink: #ffffff;
  --brand-soft: #eef3fc;
  --danger: #d64545;
  --ok: #2f9e6e;
  --warn: #d9852b;
  --radius: 14px;
  --radius-lg: 20px;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px -12px rgba(16, 24, 40, .16);
  --tab-h: 58px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  font-synthesis-weight: none;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body { min-height: 100dvh; }

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
}

.view {
  padding: 0 16px calc(var(--tab-h) + var(--safe-b) + 20px);
  padding-top: calc(var(--safe-t) + 14px);
  animation: fade .18s ease;
}

@keyframes fade { from { opacity: 0; transform: translateY(2px); } to { opacity: 1; transform: none; } }

/* ---------- 页头 ---------- */

.hd {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 0 16px;
}

.hd h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -.3px;
}

.hd .sub {
  margin: 2px 0 0;
  font-size: 13px;
  color: var(--text-2);
}

/* ---------- 卡片 ---------- */

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
}

.card.tight { padding: 12px 14px; }
.card.flat { box-shadow: none; }
.card.hero { background: var(--surface-2); border-color: transparent; }

.row { display: flex; align-items: center; gap: 10px; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }

.muted { color: var(--text-2); font-size: 13px; }
.tiny { color: var(--text-3); font-size: 11px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-2);
  margin: 20px 0 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* ---------- 按钮 ---------- */

button, .btn {
  font: inherit;
  border: 0;
  background: none;
  color: inherit;
  cursor: pointer;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 40px;
  padding: 0 16px;
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--text);
  font-size: 14px;
  font-weight: 550;
  transition: transform .12s ease, opacity .12s ease;
}

.btn:active { transform: scale(.98); opacity: .85; }
.btn.primary { background: var(--brand); color: var(--brand-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line-strong); }
.btn.danger { color: var(--danger); background: #fdf1f1; }
.btn.block { width: 100%; height: 46px; font-size: 15px; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

.icon-btn {
  width: 36px; height: 36px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 10px;
  color: var(--text-2);
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 20px; height: 20px; }

/* ---------- 输入 ---------- */

input, select, textarea {
  font: inherit;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 11px 13px;
  width: 100%;
  outline: none;
  transition: border-color .15s ease, background .15s ease;
}

input:focus, select:focus, textarea:focus {
  background: #fff;
  border-color: var(--brand);
}

input::placeholder { color: var(--text-3); }

.field { margin-bottom: 12px; }
.field label {
  display: block;
  font-size: 12px;
  color: var(--text-2);
  margin: 0 0 6px 2px;
}

/* ---------- 底部导航 ---------- */

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  display: flex;
  max-width: 560px;
  margin: 0 auto;
  height: calc(var(--tab-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  background: rgba(255, 255, 255, .92);
  backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line);
}

.tab {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  text-decoration: none;
  color: var(--text-3);
  font-size: 11px;
  letter-spacing: .2px;
  transition: color .15s ease;
}

.tab svg {
  width: 24px; height: 24px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.tab.active { color: var(--brand); }
.tab.active svg { stroke-width: 2; }

/* ---------- 课表 ---------- */

.week-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}

.week-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 34px;
  padding: 0 12px;
  border-radius: 10px;
  background: var(--surface-2);
  font-weight: 600;
  font-size: 14px;
}

.tt-scroll { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }

.tt-grid {
  display: grid;
  grid-template-columns: 28px repeat(7, minmax(0, 1fr));
  gap: 4px 3px;
  min-width: 0;
}

.tt-head {
  text-align: center;
  padding: 4px 0 8px;
  font-size: 11px;
  color: var(--text-2);
  line-height: 1.25;
}

.tt-head b {
  display: block;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -.2px;
}

.tt-head.today b { color: var(--brand); }
.tt-head.today span { color: var(--brand); font-weight: 600; }

.tt-time {
  font-size: 10px;
  color: var(--text-3);
  text-align: right;
  padding-right: 2px;
  line-height: 1.2;
  transform: translateY(-2px);
}

.tt-time small { display: block; font-size: 9px; }

.tt-cell {
  border-radius: 8px;
  min-height: 46px;
  background: transparent;
}

.tt-course {
  border-radius: 9px;
  padding: 5px 4px 4px;
  font-size: 10px;
  line-height: 1.28;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  gap: 2px;
  border: 1px solid transparent;
  text-align: left;
}

.tt-course b {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: -.2px;
  word-break: break-all;
}

.tt-course span {
  font-size: 9.5px;
  opacity: .95;
  font-weight: 500;
  letter-spacing: -.2px;
  word-break: break-all;
}

.tt-course:active { opacity: .8; }

.today-list { display: flex; flex-direction: column; gap: 8px; }

.today-item {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}

.today-item .bar {
  width: 3px;
  align-self: stretch;
  border-radius: 3px;
  background: var(--brand);
}

.today-item .t { font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums; }

/* ---------- 记账 ---------- */

.amount-box {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 6px 0 4px;
}

.amount-box .cur { font-size: 20px; color: var(--text-2); }

.amount-box input {
  background: transparent;
  border: 0;
  padding: 0;
  font-size: 40px;
  font-weight: 650;
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
}

.amount-box input::placeholder { color: #d7dbe2; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.chip {
  height: 34px;
  padding: 0 13px;
  border-radius: 999px;
  background: var(--surface-2);
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: var(--text);
  border: 1px solid transparent;
  transition: background .15s ease, color .15s ease;
}

.chip.on { background: var(--brand); color: #fff; }

.money { font-variant-numeric: tabular-nums; }

.exp-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.exp-item:last-child { border-bottom: 0; }

.exp-ico {
  width: 36px; height: 36px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  font-size: 17px;
  background: var(--surface-2);
  flex: none;
}

.exp-item .val { font-weight: 600; font-variant-numeric: tabular-nums; }

.bar-chart { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }

.bar-row { display: flex; flex-direction: column; gap: 4px; }

.bar-row .lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-2); }

.bar-track { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; background: var(--brand); }

.summary-num {
  font-size: 32px;
  font-weight: 660;
  letter-spacing: -1px;
  font-variant-numeric: tabular-nums;
}

/* ---------- 待办 ---------- */

.todo-item {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.todo-item:last-child { border-bottom: 0; }

.check {
  width: 22px; height: 22px;
  border-radius: 7px;
  border: 1.6px solid var(--line-strong);
  flex: none;
  margin-top: 1px;
  display: grid;
  place-items: center;
  transition: background .15s ease, border-color .15s ease;
}

.check svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.4; fill: none; opacity: 0; }

.todo-item.done .check { background: var(--brand); border-color: var(--brand); }
.todo-item.done .check svg { opacity: 1; }
.todo-item.done .todo-text { color: var(--text-3); text-decoration: line-through; }

.todo-text { font-size: 15px; word-break: break-word; }

.due {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-2);
  margin-top: 3px;
}

.due.soon { color: var(--warn); }
.due.over { color: var(--danger); }

/* ---------- 弹层 ---------- */

.sheet-mask {
  position: fixed;
  inset: 0;
  background: rgba(12, 16, 24, .35);
  z-index: 40;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: maskIn .16s ease;
}

@keyframes maskIn { from { opacity: 0; } to { opacity: 1; } }

.sheet {
  width: 100%;
  max-width: 560px;
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 18px 16px calc(18px + var(--safe-b));
  animation: sheetUp .22s cubic-bezier(.22, .8, .28, 1);
  max-height: 88dvh;
  overflow-y: auto;
}

@keyframes sheetUp { from { transform: translateY(16px); opacity: .6; } to { transform: none; opacity: 1; } }

.sheet h2 { margin: 0 0 4px; font-size: 17px; font-weight: 650; }

.sheet .grab {
  width: 36px; height: 4px;
  border-radius: 99px;
  background: var(--line-strong);
  margin: 0 auto 12px;
}

/* ---------- 其它 ---------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--tab-h) + var(--safe-b) + 18px);
  transform: translate(-50%, 8px);
  background: rgba(22, 24, 29, .92);
  color: #fff;
  font-size: 13px;
  padding: 9px 15px;
  border-radius: 11px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  z-index: 60;
  max-width: 82vw;
  text-align: center;
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }

.empty {
  text-align: center;
  color: var(--text-3);
  font-size: 13px;
  padding: 34px 0;
}

.list-plain { list-style: none; margin: 0; padding: 0; }

.kv {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
}

.kv:last-child { border-bottom: 0; }
.kv .v { color: var(--text-2); font-variant-numeric: tabular-nums; }

.seg {
  display: flex;
  background: var(--surface-2);
  border-radius: 11px;
  padding: 3px;
  gap: 2px;
}

.seg button {
  flex: 1;
  height: 30px;
  border-radius: 9px;
  font-size: 13px;
  color: var(--text-2);
}

.seg button.on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(16, 24, 40, .1); font-weight: 550; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>
</head>

  </nav>
</div>

    const data = JSON.parse(json);
    const list = Array.isArray(data) ? data : data.courses;
    if (!Array.isArray(list) || !list.length) throw new Error('没有解析到课程');
    update((s) => {
      s.courses = list.map((c, i) => ({
        id: c.id || `imp-${i}`,
        name: c.name || '未命名课程',
        short: c.short || String(c.name || '').slice(0, 4),
        day: Number(c.day) || 1,
        start: Number(c.start) || 1,
        end: Math.max(Number(c.start) || 1, Number(c.end) || 1),
        room: c.room || '',
        teacher: c.teacher || '',
        color: c.color || 'blue',
        weeks: c.weeks || { start: 1, end: 18, parity: 'all' },
      }));
    });
    history.replaceState(null, '', `${location.pathname}#/timetable`);
    toast(`已导入 ${list.length} 门课`);
    return true;
  } catch (err) {
    console.warn('[import] 书签数据解析失败', err);
    toast('导入数据格式不对', 2600);
    return false;
  }
}

consumeImportHash();

/* 首次打开：灌入课表 */
seedIfEmpty(SEED_COURSES);

/* 数据变化时重绘当前页（例如在弹层里删了一条记录） */
subscribe(() => {
  if (current) ROUTES[current].render(view);
});

navigate();

/* 离线缓存（只在 http/https 下可用，file:// 直接跳过） */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('[sw] 注册失败（不影响使用）', err);
    });
  });
}

/* 手机从后台切回来时，如果跨天了就刷新一下「今天」 */
let lastDay = new Date().toDateString();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const now = new Date().toDateString();
  if (now !== lastDay) {
    lastDay = now;
    render();
  }
});

/* 开发用：?probe=1 时把布局尺寸写进页面，方便无头浏览器检查 */
if (new URLSearchParams(location.search).has('probe')) {
  const box = (sel) => {
    const el = document.querySelector(sel);
    if (!el) return 'none';
    const b = el.getBoundingClientRect();
    return `${Math.round(b.width)}w @${Math.round(b.left)}`;
  };
  const cols = getComputedStyle(document.querySelector('.tt-grid') || document.body).gridTemplateColumns;
  let storage = 'ok';
  try {
    localStorage.setItem('__probe', '1');
    localStorage.removeItem('__probe');
  } catch (err) {
    storage = `fail:${err.name}`;
  }
  const pre = document.createElement('pre');
  pre.id = 'probe';
  pre.textContent = JSON.stringify({
    iw: innerWidth,
    sw: document.documentElement.scrollWidth,
    dpr: devicePixelRatio,
    storage,
    app: box('.app'),
    view: box('.view'),
    bar: box('.week-bar'),
    grid: box('.tt-grid'),
    cols,
  });
  document.body.appendChild(pre);
}

 })();
})();
</script>
</body>
</html>
